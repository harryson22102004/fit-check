[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-st"
version = "0.1.0"
description = "Kokborok-first Indic speech translation: ASR cascade, BhasaAnuvaad tracks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0.0",
  "transformers>=4.44.0",
  "accelerate>=0.34.0",
  "librosa>=0.10.0",
  "soundfile>=0.12.0",
  "numpy>=1.24.0",
  "torch>=2.2.0",
]

[project.optional-dependencies]
demo = ["gradio>=5.0.0"]

[tool.setuptools.packages.find]
include = ["indic_st*"]
